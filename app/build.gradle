plugins {
    id 'com.android.application'
}

android {
    namespace 'com.exeai.assistant'
    compileSdk 35

    defaultConfig {
        applicationId 'com.exeai.assistant'
        minSdk 23
        targetSdk 35
        versionCode 80
        versionName "8.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// kotlin-stdlib 1.8+ already contains the jdk7/jdk8 classes. Older transitive copies (1.6.21)
// from other libraries cause checkDebugDuplicateClasses to fail, so they are excluded here.
configurations.all {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'org.jsoup:jsoup:1.18.3'
}
